version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-bot-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-bot-worker
    restart: unless-stopped
    command: celery -A worker.tasks.celery_app worker -l info -c 2
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-bot-beat
    restart: unless-stopped
    command: celery -A worker.tasks.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: telegram-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
