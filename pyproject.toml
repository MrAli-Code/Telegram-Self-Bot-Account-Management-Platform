[project]
name = "telegram-self-bot"
version = "1.0.0"
description = "Professional Telegram Self-Bot / Account Management Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Telegram Self-Bot Team"}]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "telethon>=1.34.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "pymysql>=1.1.0",
    "redis[hiredis]>=5.0.1",
    "celery[redis]>=5.3.6",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.25.2",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.7",
    "apscheduler>=3.10.4",
    "Pillow>=10.1.0",
    "orjson>=3.9.10",
    "structlog>=23.2.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "aiosmtplib>=3.0.1",
    "websockets>=12.0",
    "bleach>=6.1.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.2",
    "mypy>=1.7.1",
    "ruff>=0.1.8",
    "black>=23.12.1",
]
ai = [
    "openai>=1.6.1",
    "google-generativeai>=0.3.2",
    "tiktoken>=0.5.2",
]
media = [
    "ffmpeg-python>=0.2.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.14",
]

[project.scripts]
telegram-bot = "backend.app.main:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
